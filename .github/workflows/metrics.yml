name: Generate Synthwave Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Sleek Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: alireza-ebrahimi-ai
          template: classic
          
          # 1. 🗑️ ONLY keep the header (removes all the cluttered 0s)
          base: header
          
          # 2. 🎨 Apply the true Synthwave neon palette
          config_theme: synthwave 
          
          # 3. 💻 Show a sleek language bar
          plugin_languages: yes
          # Ignore Jupyter so Python and C++ take the spotlight!
          plugin_languages_ignored: jupyter notebook, html, css
          plugin_languages_limit: 4
          plugin_languages_details: percentage
