name: Generate True Synthwave Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Your Profile Repository
        uses: actions/checkout@v4
      
      - name: Clone GitHub Readme Stats
        run: git clone https://github.com/anuraghazra/github-readme-stats.git
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Lock to Node 18 to guarantee stability and prevent the Node 24 warning
          node-version: '18' 
          
      - name: Start Local Server & Generate Glowing SVGs
        env:
          PAT_1: ${{ secrets.METRICS_TOKEN }} 
        run: |
          cd github-readme-stats
          npm install
          
          # Start the server in the background and save logs
          npm start > server.log 2>&1 &
          
          # Dynamically wait for the server to be ready (timeout after 30s)
          # If it fails, print the server logs so we can see exactly why!
          npx wait-on http://127.0.0.1:9000 -t 30000 || (cat server.log && exit 1)
          
          # Fetch the Main Stats (Using 127.0.0.1 bypasses the IPv6 localhost bug!)
          curl -f -s "http://127.0.0.1:9000/api?username=alireza-ebrahimi-ai&theme=synthwave&show_icons=true&hide_border=true" -o ../synthwave-stats.svg
          
          # Fetch the Top Languages
          curl -f -s "http://127.0.0.1:9000/api/top-langs/?username=alireza-ebrahimi-ai&theme=synthwave&layout=compact&hide_border=true" -o ../synthwave-langs.svg
          
      - name: Cleanup and Commit to your Repo
        run: |
          rm -rf github-readme-stats
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synthwave-stats.svg synthwave-langs.svg
          git commit -m "Update True Synthwave Stats" || exit 0
          git push
