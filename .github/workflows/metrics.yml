name: Generate True Synthwave Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Your Profile Repository
        uses: actions/checkout@v4
      
      - name: Clone GitHub Readme Stats
        run: git clone https://github.com/anuraghazra/github-readme-stats.git
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Start Local Server & Generate Glowing SVGs
        env:
          PAT_1: ${{ secrets.METRICS_TOKEN }} 
        run: |
          cd github-readme-stats
          
          # Clean install all exact dependencies
          npm ci
          
          # Start the server engine directly (Bypassing npm start)
          node express.js > server.log 2>&1 &
          
          # Give the server a few seconds to boot up
          sleep 5
          
          # Fetch Main Stats (with active retry logic just in case it's slow!)
          curl --retry 10 --retry-delay 2 --retry-connrefused -f -s "http://127.0.0.1:9000/api?username=alireza-ebrahimi-ai&theme=synthwave&show_icons=true&hide_border=true" -o ../synthwave-stats.svg || (cat server.log && exit 1)
          
          # Fetch Top Languages
          curl --retry 10 --retry-delay 2 --retry-connrefused -f -s "http://127.0.0.1:9000/api/top-langs/?username=alireza-ebrahimi-ai&theme=synthwave&layout=compact&hide_border=true" -o ../synthwave-langs.svg || (cat server.log && exit 1)
          
      - name: Cleanup and Commit to your Repo
        run: |
          rm -rf github-readme-stats
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synthwave-stats.svg synthwave-langs.svg
          git commit -m "Update True Synthwave Stats" || exit 0
          git push
