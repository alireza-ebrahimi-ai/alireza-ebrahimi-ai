name: Generate True Synthwave Stats

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Clone your own repository with full history
      - name: Checkout Your Profile Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Clone the stats engine
      - name: Clone GitHub Readme Stats
        run: git clone https://github.com/anuraghazra/github-readme-stats.git
        
      # Step 3: Setup Node.js runtime
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # Step 4: Start local Express server and generate glowing SVGs
      - name: Start Local Server & Generate Glowing SVGs
        env:
          PAT_1: ${{ secrets.METRICS_TOKEN }} 
        run: |
          cd github-readme-stats
          npm ci
          npm install express
          
          PORT=9000 node express.js > server.log 2>&1 &
          sleep 5
          
          echo "==== SERVER BOOT LOGS ===="
          cat server.log
          echo "=========================="
          
          # Fetch Synthwave Main Stats
          curl --retry 5 --retry-delay 2 --retry-connrefused -f -s "http://127.0.0.1:9000/api?username=alireza-ebrahimi-ai&theme=synthwave&show_icons=true&hide_border=true" -o ../synthwave-stats.svg
          
          # Fetch Synthwave Top Languages
          curl --retry 5 --retry-delay 2 --retry-connrefused -f -s "http://127.0.0.1:9000/api/top-langs/?username=alireza-ebrahimi-ai&theme=synthwave&layout=compact&hide_border=true" -o ../synthwave-langs.svg

      # Step 5: Generate the retro Synthwave Snake
      - name: Generate Synthwave Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alireza-ebrahimi-ai
          outputs: |
            github-snake.svg?color_snake=#ff007f&color_dots=#161b22,#3d1e6d,#800080,#00c8ff,#00ffff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Commit SVGs & Generate Randomized Contributions
      - name: Cleanup and Commit to your Repo
        run: |
          rm -rf github-readme-stats
          
          # 🚨 REPLACE WITH YOUR ACTUAL GITHUB EMAIL 🚨
          git config --global user.name "alireza-ebrahimi-ai"
          git config --global user.email "alirezaebrahimi.ai@gmail.com"
          
          # 1. Commit the glowing SVGs first
          git add synthwave-stats.svg synthwave-langs.svg github-snake.svg
          git commit -m "chore(stats): update synthwave cards and snake animation" || true
          
          # 2. Generate randomized micro-commits (between 2 and 6 commits)
          # This creates the lighter green and vibrant squares on your calendar!
          RANDOM_COMMITS=$(( ( RANDOM % 5 ) + 2 ))
          
          for i in $(seq 1 $RANDOM_COMMITS); do
            echo "Heartbeat sync at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .telemetry
            git add .telemetry
            git commit -m "chore(sync): automated metric verification [pulse $i/$RANDOM_COMMITS]" || true
          done
          
          # 3. Pull any remote changes and push to GitHub
          git pull --rebase origin main
          git push
