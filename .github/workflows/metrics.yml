name: Generate GitHub Metrics

on:
  # 🕒 Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # 🚀 Allow manual triggering from the Actions tab
  workflow_dispatch:
  # 💻 Run whenever you update your main code
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Synthwave Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: alireza-ebrahimi-ai
          template: classic
          base: header, activity, community, repositories, metadata
          # 'radical' is a built-in dark theme with neon pink/blue accents!
          config_theme: radical 
          config_timezone: Europe/London
          # Adds your Top Languages automatically
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_colors: github
