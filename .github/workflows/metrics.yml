name: Generate True Synthwave Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Your Profile Repository
        uses: actions/checkout@v4
      
      - name: Clone GitHub Readme Stats
        run: git clone https://github.com/anuraghazra/github-readme-stats.git
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Start Local Server & Generate Glowing SVGs
        env:
          PAT_1: ${{ secrets.METRICS_TOKEN }} 
        run: |
          cd github-readme-stats
          
          # Clean install AND explicitly install express just in case!
          npm ci
          npm install express
          
          # Force the server to port 9000 and run in background
          PORT=9000 node express.js > server.log 2>&1 &
          
          # Wait 5 seconds for it to fully start
          sleep 5
          
          # 🔍 OBSERVABILITY: Print the server logs to the console!
          echo "==== SERVER BOOT LOGS ===="
          cat server.log
          echo "=========================="
          
          # Fetch Main Stats (Bypass IPv6 issues by using 127.0.0.1)
          curl --retry 5 --retry-delay 2 --retry-connrefused -f -s "http://127.0.0.1:9000/api?username=alireza-ebrahimi-ai&theme=synthwave&show_icons=true&hide_border=true" -o ../synthwave-stats.svg
          
          # Fetch Top Languages
          curl --retry 5 --retry-delay 2 --retry-connrefused -f -s "http://127.0.0.1:9000/api/top-langs/?username=alireza-ebrahimi-ai&theme=synthwave&layout=compact&hide_border=true" -o ../synthwave-langs.svg
          
      - name: Cleanup and Commit to your Repo
        run: |
          rm -rf github-readme-stats
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synthwave-stats.svg synthwave-langs.svg
          git commit -m "Update True Synthwave Stats" || exit 0
          git push
